name: Construire l'application PHP

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image du commit
        run: docker build --pull -t app-php:${{ github.sha }} .
      - name: Vérifier la syntaxe PHP
        run: docker run --rm app-php:${{ github.sha }} php -l index.php
